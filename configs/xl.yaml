model:
  vocab_size: 256000
  dim: 16384
  n_heads: 128
  n_kv_heads: 8
  max_seq_len: 131072
  max_loop_iters: 64
  prelude_layers: 16
  coda_layers: 8
  attn_type: mla
  n_experts: 512
  n_shared_experts: 8
  n_experts_per_tok: 8
  expert_dim: 8192
  act_threshold: 0.99
  lora_rank: 32

training:
  batch_size: 1
  gradient_accumulation: 128
  learning_rate: 1.0e-4
  weight_decay: 0.1
  grad_clip: 1.0
  mixed_precision: true
  num_epochs: 200

distributed:
  enabled: true
  world_size: 64