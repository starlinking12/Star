model:
  vocab_size: 128000
  dim: 8192
  n_heads: 64
  n_kv_heads: 8
  max_seq_len: 32768
  max_loop_iters: 32
  prelude_layers: 8
  coda_layers: 4
  attn_type: mla
  n_experts: 256
  n_shared_experts: 4
  n_experts_per_tok: 8
  expert_dim: 4096
  act_threshold: 0.99
  lora_rank: 16

training:
  batch_size: 4
  learning_rate: 1.5e-4
  weight_decay: 0.1
  grad_clip: 1.0
  mixed_precision: true
  num_epochs: 200

distributed:
  enabled: true
  world_size: 64